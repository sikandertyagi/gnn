# elastic_config.yml
# ──────────────────
# Configuration for elastic_ingest.py — pulls Elastic SIEM data and
# prepares the CSV that main.py (the GNN anomaly pipeline) consumes.
#
# All values can be overridden by environment variables (see elastic_ingest.py).

# ─────────────────────────────────────────────────────────────────────────────
# 1. ELASTICSEARCH CONNECTION
# ─────────────────────────────────────────────────────────────────────────────

# Self-hosted cluster over HTTPS (cert verification disabled)
host: "https://your-elastic-host:9200"

# Username / password auth
username: "elastic"
password: "changeme"

# TLS verification — set false for plain HTTP or self-signed certs
verify_certs: false

# Pagination: hits per search_after page (reduce to 1000 on slow clusters)
page_size: 5000


# ─────────────────────────────────────────────────────────────────────────────
# 2. DATA SOURCES  ← THE ONLY FLAG YOU NEED TO CHANGE
# ─────────────────────────────────────────────────────────────────────────────
#
# Uncomment exactly ONE of the three presets below.
#
# OPTION A — Elastic Defend only  (current)
sources:
  - defend

# OPTION B — Wazuh Sysmon only
# sources:
#   - wazuh

# OPTION C — Both (Elastic Defend + Wazuh Sysmon)
# sources:
#   - defend
#   - wazuh
#
# ── Notes ─────────────────────────────────────────────────────────────────────
#  defend  → Elastic Defend endpoint agent (ECS fields: process.*, destination.*)
#  wazuh   → Sysmon events forwarded via Wazuh (data.win.eventdata.* fields)
#  sysmon  → Sysmon events via Winlogbeat / Elastic Agent (winlog.event_data.*)
#            Add "- sysmon" to any preset above if you have Winlogbeat as well.
#
#  When multiple sources cover the same hosts the connector deduplicates by
#  (host, timestamp, image, eventid) so events are never double-counted.

# Index patterns — adjust if your cluster uses non-default index names ─────────
sysmon_index:  "winlogbeat-*,logs-windows.sysmon_operational-*"
defend_index:  "logs-endpoint.events.process-*,logs-endpoint.events.network-*,.ds-logs-endpoint.events.process-*,.ds-logs-endpoint.events.network-*"
wazuh_index:   "wazuh-alerts-4.x-*,wazuh-archives-4.x-*"


# ─────────────────────────────────────────────────────────────────────────────
# 3. DATE WINDOWS
# ─────────────────────────────────────────────────────────────────────────────
#
# TRAINING window (Nov–Dec 2025)
#   Assumption: endpoint activity in this period is predominantly benign.
#   All three models (GNN encoder, Rarity engine, Transformer autoencoder)
#   are trained exclusively on this data.
#   In the output CSV these events are assigned an INTERNAL marker Label=0.
#   This is NOT a ground-truth annotation — it simply tells the pipeline
#   "train on these rows".
#
train_start: "2025-11-01T00:00:00Z"
train_end:   "2025-12-31T23:59:59Z"

# EVALUATION window (Jan 2026)
#   No ground-truth labels exist.  The pipeline scores every event in this
#   window against the Nov–Dec baseline.  A small fraction are expected to be
#   anomalous; the rest are still benign.
#   In the output CSV these events are assigned an INTERNAL marker Label=2.
#   Label=2 means "evaluation period — do not train on, but score".
#   The pipeline NEVER uses Label=2 rows for training.
#   Anomalies found here are written to anomaly_report.txt and
#   flagged_events.csv for your manual verification.
#
eval_start:  "2026-01-01T00:00:00Z"
eval_end:    "2026-01-31T23:59:59Z"


# ─────────────────────────────────────────────────────────────────────────────
# 4. OUTPUT
# ─────────────────────────────────────────────────────────────────────────────
# Path for the merged CSV written by elastic_ingest.py.
# Matches DATA_PATH in config.py — both point to the large-capacity data volume.
output_path: "/gulshan_data/anomaly_detection/elastic_data.csv"
